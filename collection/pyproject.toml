[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hil-umi-collection"
version = "0.1.0"
description = "HIL-UMI OOD monitors and external recorder integration"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "numpy>=1.26,<3",
  "PyYAML>=6,<7",
  "Pillow>=10,<12",
  "omegaconf>=2.3,<3",
  "aiohttp>=3.9,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1"]

[tool.setuptools.packages.find]
include = ["ood", "ood.*"]

[tool.setuptools.package-data]
ood = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit_tests"]
pythonpath = ["."]
markers = ["integration: requires a user-provided data_recorder installation or wheel"]
