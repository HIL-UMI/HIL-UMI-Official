defaults:
  - model/pi0_5_pytorch_single_franka@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

# Single-Franka tcp_rot6d SFT on the openpi_pytorch Pi0.5 path.
# Expected LeRobot columns:
#   state/actions: [xyz, rot6d, gripper]
#   image: wrist/hand view
#   extra_view_image: base/front view
#
# Norm stats should be computed with the same config name and dataset, then
# stored at:
#   <actor.model.openpi.assets_dir>/<actor.model.openpi.asset_id>/norm_stats.json

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-7

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: training
    experiment_name: "umi_left_franka_tcp_rot6d_openpi_pytorch_sft"
    logger_backends: ["tensorboard"]

  max_epochs: -1
  max_steps: 30000
  val_check_interval: -1
  save_interval: 10000
  resume_dir: null
  # Move each completed checkpoint to shared storage immediately. The runner
  # preserves the logs/<run>/<experiment>/checkpoints/global_step_<N> layout
  # and keeps the local checkpoint if the transfer fails.
  checkpoint_offload_dir: "${oc.env:HIL_UMI_ROOT,.}/outputs/checkpoint_offload"

data:
  train_data_paths: ${oc.env:UMI_LEFT_FRANKA_DATA_ROOT,${oc.env:HIL_UMI_ROOT,.}/dataset/stack_cubes_umi}
  # Match OpenPI's prompt_from_task behavior: task_index is mapped through
  # meta/tasks.jsonl for every frame. ACBC additionally validates that the
  # dataset is self-contained and advantage-conditioned before training.
  prompt_from_task: true
  acbc: false
  # Mix ACBC samples from train_data_paths and mix_acbc_data_path. Ratios are
  # positive relative weights and default to an exact 50/50 batch mixture.
  mix_acbc: false
  mix_acbc_data_path: null
  mix_acbc_primary_ratio: 0.5
  mix_acbc_secondary_ratio: 0.5
  # Offline post-training can mix demonstrations and newly collected data
  # using the ratio below. HIL-UMI applies Advantage-conditioned prompts.
  post_train: false
  post_train_data_path: null
  post_train_demo_ratio: 0.5
  post_train_correction_ratio: 0.5
  repo_id: ""
  num_workers: 4

algorithm:
  adv_type: gae

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 4
  eval_batch_size: 1
  # Supports both --gpus 0-7 and --gpus 0-3 with micro_batch_size=4.
  global_batch_size: 32
  seed: 0

  model:
    model_path: ${oc.env:PI05_BASE_CKPT,${oc.env:HIL_UMI_ROOT,.}/checkpoints/pi05/base}
    openpi:
      assets_dir: ${oc.env:UMI_LEFT_FRANKA_ASSETS_DIR,/path/to/your/assets}
      asset_id: ${oc.env:UMI_LEFT_FRANKA_ASSET_ID,your_dataset}

  optim:
    lr: 2.5e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1e-10
    clip_grad: 1.0
    total_training_steps: 40000
    lr_warmup_steps: 1000
    lr_scheduler: "openpi_cosine"
    num_cycles: 0.5
    min_lr: 2.5e-6

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    use_orig_params: True
    gradient_checkpointing: True
    gradient_checkpointing_use_reentrant: False
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32

reward:
  use_reward_model: False

critic:
  use_critic_model: False
